name: Release installers

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Build-only version, for example v0.1.0 (does not publish)'
        required: true
        default: 'v0.1.0'
        type: string
      verify_windows_release:
        description: 'Test an existing Windows release instead of building (e.g. v0.1.1)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

defaults:
  run:
    shell: bash

jobs:
  build:
    if: inputs.verify_windows_release == ''
    name: Build ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: Windows-x64
            runner: windows-2022
            platform: win
            arch: x64
          - id: macOS-arm64
            runner: macos-15
            platform: mac
            arch: arm64
          - id: macOS-x64
            runner: macos-15-intel
            platform: mac
            arch: x64
          - id: Linux-x64
            runner: ubuntu-22.04
            platform: linux
            arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
          cache: true
      - name: Validate release version
        id: version
        run: node scripts/release.mjs version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Linux ZIP support
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Prepare pinned Hiyori and Live2D runtime
        run: node scripts/fetch-pet-sdk.mjs
      - name: Package empty workspace
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm --filter @memo/desktop package:release --${{ matrix.platform }} --${{ matrix.arch }} "--config.extraMetadata.version=$RELEASE_VERSION"
      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.id }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Verify and publish
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets
      - name: Verify all five installers and create SHA256SUMS
        run: node scripts/release.mjs verify release-assets
      - name: Publish tag release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish release-assets

  windows-installed-verification:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_windows_release != ''
    name: Verify installed Windows release
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.34.5
          cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download and install the published Windows package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUGU_VERIFY_TAG: ${{ inputs.verify_windows_release }}
        run: ./tests/release/install-windows-release.ps1
      - name: Verify packaged UI, database, default pet and relaunch
        run: node tests/release/windows-installed-smoke.mjs
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-installed-startup
          path: test-results/windows-installed/
          if-no-files-found: error
          retention-days: 7
