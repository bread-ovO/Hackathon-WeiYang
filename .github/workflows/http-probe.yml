name: Public HTTP source probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/plugin-host/**'
      - 'packages/connectors/**'
      - 'apps/desktop/src/main/source-http.ts'
      - 'examples/sources/**'
      - 'scripts/probe-http-source.mjs'
      - '.github/workflows/http-probe.yml'
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # External availability is diagnostic, not a deterministic correctness gate.
      # Only fixed public release metadata is requested; no token is passed.
      - name: Probe public release metadata
        id: probe
        continue-on-error: true
        run: node scripts/probe-http-source.mjs | tee http-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-http-source-probe
          path: http-probe.log
